<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 | Página No Encontrada</title>
    <!-- Bootswatch Morph CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/morph/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container text-center" style="max-width: 520px;">
        <div class="card border-0 p-4 p-md-5 shadow-lg rounded-4 bg-light">
            <div class="card-body">
                <div class="text-primary mb-3">
                    <i class="bi bi-exclamation-triangle-fill display-1"></i>
                </div>
                <h1 class="display-3 fw-bold text-primary mb-0">404</h1>
                <h3 class="fw-bold text-dark my-3">Página no encontrada</h3>
                <p class="text-muted mb-4">
                    La ruta a la que intentas acceder no existe en el sistema de inventario o fue movida.
                </p>
                <a href="/" class="btn btn-primary btn-lg rounded-pill px-4 shadow-sm">
                    <i class="bi bi-house-door me-2"></i>Volver al Inicio
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
